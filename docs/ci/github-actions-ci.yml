name: PaperMentor CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools for extraction smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick file
      - name: Syntax checks
        run: |
          node --check scripts/papermentor-session.mjs
          node --check scripts/validate.mjs
          node --check scripts/install.mjs
          node --check scripts/manifest.mjs
          node --check scripts/sync-manifest.mjs
          bash -n install.sh
      - name: Validate skill and runtime
        run: npm test
      - name: Manifest sync check
        run: npm run manifest:check
      - name: Package contents and size check
        run: npm run pack:check
